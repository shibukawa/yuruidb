id: milestone:core-bbolt
type: milestone
title: Proposed first usable Go storage slice
summary: Implement the common record contract and a bbolt driver with shared conformance tests before cloud integrations.
lifecycle: active
authority: inferred
facts:
  outcome: Persistent local CRUD, ID-ordered listing, and revision conflict detection through the common API.
  recommended_approach: Core contract plus bbolt; keep driver imports outside the core.
  alternative: Core plus a remote object driver first tests HTTP/auth/CAS earlier but requires provider setup and
    integration access.
  tradeoff: bbolt tests persistence and API semantics without cloud credentials, but cannot validate distributed
    provider behavior.
  implementation_state: Completed and locally verified; see implementation:initial-library for the broader delivered
    slice.
  revisit_triggers:
  - Finalize API/data-format stability before publication.
  - Run live provider integration when a target and credentials are selected.
  completion_scope: Go 1.27 generic methods, type-bound collections, name IDs, shared bbolt paths, conditional physical
    deletion, binary values, conformance and import isolation.
acceptance:
  persistent-crud:
    text: Inserted/updated records survive reopen and deleted records are absent.
    verified_by:
    - reopen
  creation-order:
    text: Listing follows immutable ID order and update leaves the ordering key unchanged.
    verified_by:
    - conformance
  conditional-write:
    text: Stale expected revisions cannot update or delete a record.
    verified_by:
    - conformance
  dependency-boundary:
    text: Core plus bbolt does not import cloud backend implementations.
    verified_by:
    - imports
