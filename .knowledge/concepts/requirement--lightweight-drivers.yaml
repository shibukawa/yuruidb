id: requirement:lightweight-drivers
type: requirement
title: Small optional dependency surface
summary: Prefer thin HTTP access where feasible and avoid bundling all backend SDKs.
lifecycle: accepted
authority: authored
aliases:
- HTTP API
- SDK
- 軽量
- バイナリサイズ
assertions:
- key: lightweight
  predicate: dependency_preference
  value: Thin HTTP API clients when feasible; avoid monolithic SDK bundling
  authority: authored
  basis:
  - path: docs/requirements-input.md
    input_hash: d9795855517cf2f1321c52cd5e78792aeaf8a5393a028050011a8e07071ee115
  evidence:
    input_path: docs/requirements-input.md
facts:
  hard_vs_preference: HTTP is a preference; the user did not prohibit every SDK dependency.
  core_proposal: A core module with no cloud SDK or database driver imports.
  auth_proposal: Inject a signer/credential or token provider, HTTP client, endpoints, and cancellation context.
  auth_obligations: Signing, credential refresh, retries, and error mapping remain required with HTTP.
  rdb_boundary: General RDB support may use native database drivers; do not invent a universal HTTP API.
  measurement_axes:
  - selected executable size
  - dependency graph/download size
  - initialization cost
  - maintenance burden
  sdk_alternative: Evaluate selected AWS SDK v2 modules against a handwritten HTTP client rather than assuming a
    size result.
  implemented_dependency_boundary: Standard-library-only core and cloud drivers; root module declares bbolt; test-only
    pure-Go modernc SQLite is isolated in integration/go.mod.
  auth_implementation: SigV4 with environment/web identity/container/IMDSv2 role providers and refresh, plus injected
    providers and GCP metadata tokens.
acceptance:
  dependency-isolation:
    text: Using the core and one explicitly selected driver does not force import of unrelated backend implementations.
    verified_by:
    - dependency-audit
verification:
  dependency-audit:
    state: passed
    method: static
    test: go test -race ./...; see saved implementation-validation report
    authority: observed
    basis:
    - path: scripts/check-builds.py
      input_hash: 616e685b0406c9bc8bfde7ce1b48cf41addc0f311a3e1efa43ad4f63b7e99c12
    - path: go.mod
      input_hash: e44147fdb31655b4b1f85a3e3f469753946b6112bd0236946c3f66c233edb88c
    - path: docs/implementation-validation.md
      input_hash: 09198cbe95e8737bb38937807a8f75f63b5238d2c3d011d9a0d86e27a89324fc
    evidence:
      input_path: docs/implementation-validation.md
    scope:
      environment: build
open_questions:
  size-budget:
    text: What numerical size and startup limits matter?
    state: deferred
    resolution: Measure at the first remote driver; do not invent an arbitrary budget.
relations:
- relation: realized_by
  to: design:build-composition
