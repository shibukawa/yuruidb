id: requirement:record-crud
type: requirement
title: ID-based record operations
summary: Support generic JSON records with insert, update, ID lookup, collection listing, and delete without foreign
  keys.
lifecycle: accepted
authority: authored
aliases:
- CRUD
- select
- ID指定
- 一覧取得
- generics
- JSON
- ジェネリクス
- Record[T]
