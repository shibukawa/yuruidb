open_questions:
  value-format:
    text: Use bytes, JSON, generics, or a combination?
    state: deferred
    resolution: Initial implementation uses bytes. Revisit typed codecs after usage feedback; no final user approval
      of the API shape is implied.
  collection-shape:
    text: How are collections/namespaces and their names represented?
    state: deferred
    resolution: Implemented a collection-bound Store with validated single-component names. Revisit if tenant/hierarchical
      naming is requested.
