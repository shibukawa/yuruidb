facts:
  proposed_api:
  - Insert
  - Get
  - List
  - Update
  - Delete
  proposed_container: collection
  payload_proposal: Superseded by the user requirement for generic JSON records.
  insert_proposal: Create only when absent; never silently upsert.
  update_proposal: Replace the value of an existing record while preserving ID.
  error_candidates:
  - not_found
  - already_exists
  - conflict
  - unsupported_capability
  - outcome_unknown
  implemented_api:
  - Insert
  - Get
  - List
  - Update
  - Delete
  implemented_value: T any with encoding/json marshal and unmarshal; conversion validated before writes.
  implemented_container: Collection-bound Store[T]; Record[T] and Page[T]; portable collection names.
  driver_contract: Non-generic RawStore, RawRecord{ID, Value, Revision}, RawPage, Factory, OpenRaw. Wrap[T] provides
    the typed facade.
  json_rules:
  - Struct tags and custom JSON methods follow encoding/json.
  - Writes validate both encode and decode before any storage mutation; failures wrap ErrInvalid.
  - Get/List report invalid JSON or incompatible stored schemas; List returns no partial page.
  - Use compatible schemas across processes. T=any decodes JSON numbers as float64.
  - Default JSON decoding avoids caller input aliasing; ownership inside custom JSON methods is the application
    responsibility.
  format_compatibility: The existing byte payload envelope is preserved. Old raw bytes must contain compatible JSON
    to use the typed facade.
  metadata_api: Private id/revision fields; value-receiver ID() and Revision(); editable Data. Updating storage
    returns a new record and leaves previous metadata unchanged.
  record_json: MarshalJSON preserves id/revision/data. UnmarshalJSON replaces a complete value including metadata;
    errors leave the existing record unchanged. Encapsulation prevents accidental field assignment, not JSON-based
    replacement or stale revisions.
acceptance:
  operation-coverage:
    text: Each full-capability driver supports the five record operations.
    verified_by:
    - crud-contract
  lookup-scope:
    text: Get resolves an ID and List operates within the selected record collection.
    verified_by:
    - crud-contract
  typed-json:
    text: The public Open[T] API returns typed JSON records; invalid data fails before writes and stale revisions
      retain their conflict semantics.
    verified_by:
    - typed-json-contract
  read-only-metadata:
    text: Typed records expose metadata only through ID()/Revision(), update returns a new version, and JSON preserves
      metadata.
    verified_by:
    - metadata-contract
