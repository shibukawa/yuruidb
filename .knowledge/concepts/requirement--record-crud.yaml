open_questions:
  value-format:
    text: Use bytes, JSON, generics, or a combination?
    state: answered
    resolution: JSON Record[T]/Page[T] with read-only metadata; the user then selected a connection-scoped Store
      with Go 1.27 method type parameters.
    evidence:
      input_path: docs/requirements-input.md
      locator: Goの最低バージョンと型付きJSONレコード
  collection-shape:
    text: How are collections/namespaces and their names represented?
    state: answered
    resolution: Store-local Bind[T](stable name), T and *T normalize to one binding, Done and Waiting are distinct
      defined types. No public Collection view.
