  - list
  - delete
  authority: authored
  basis:
  - path: docs/requirements-input.md
    input_hash: d9795855517cf2f1321c52cd5e78792aeaf8a5393a028050011a8e07071ee115
  evidence:
    input_path: docs/requirements-input.md
- key: query-scope
  predicate: query_scope
  value: ID lookup and collection listing
  authority: authored
  basis:
