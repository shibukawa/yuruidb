id: requirement:record-crud
type: requirement
title: ID-based record operations
summary: Support insert, update, select by ID, list, and delete without foreign keys.
lifecycle: accepted
authority: authored
aliases:
- CRUD
- select
- ID指定
- 一覧取得
assertions:
- key: operations
  predicate: required_operations
  value:
  - insert
  - update
  - get_by_id
  - list
  - delete
  authority: authored
  basis:
  - path: docs/requirements-input.md
    input_hash: fa4903b32f8d00a4eba019ac565db0fc3a9578473d3e858eb8c0da8c7d186a86
  evidence:
    input_path: docs/requirements-input.md
- key: query-scope
  predicate: query_scope
  value: ID lookup and collection listing
  authority: authored
  basis:
  - path: docs/requirements-input.md
    input_hash: fa4903b32f8d00a4eba019ac565db0fc3a9578473d3e858eb8c0da8c7d186a86
  evidence:
    locator: 検索範囲の回答
    input_path: docs/requirements-input.md
facts:
  proposed_api:
  - Insert
  - Get
  - List
  - Update
  - Delete
  proposed_container: collection
  payload_proposal: Opaque bytes with optional codecs or typed wrappers.
  insert_proposal: Create only when absent; never silently upsert.
  update_proposal: Replace the value of an existing record while preserving ID.
  error_candidates:
  - not_found
  - already_exists
  - conflict
  - unsupported_capability
  - outcome_unknown
  implemented_api:
  - Insert
  - Get
  - List
  - Update
  - Delete
  implemented_value: '[]byte; a provisional engineering choice, not a new user requirement.'
  implemented_container: Collection-bound Store; portable collection names.
acceptance:
  operation-coverage:
    text: Each full-capability driver supports the five record operations.
    verified_by:
    - crud-contract
  lookup-scope:
    text: Get resolves an ID and List operates within the selected record collection.
    verified_by:
    - crud-contract
