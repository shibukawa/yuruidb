    input_path: docs/requirements-input.md
- key: generic-json-records
  predicate: required_record_api
  value:
    open: yuruidb.Open(ctx, driver, Config)
    record:
    - ID metadata
    - Revision metadata
    - Data T
    payload: JSON-serializable data
    binding: store.Bind[T](collection)
    lookup: store.Get[T](ctx,id)
  authority: authored
  basis:
  - path: docs/requirements-input.md
    input_hash: d9795855517cf2f1321c52cd5e78792aeaf8a5393a028050011a8e07071ee115
  evidence:
    input_path: docs/requirements-input.md
    locator: bdf利用前のフィードバックと追加方針
- key: read-only-metadata
  predicate: required_record_metadata_visibility
  value: Hide ID and revision fields; expose metadata through read methods.
  authority: authored
  basis:
  - path: docs/requirements-input.md
    input_hash: d9795855517cf2f1321c52cd5e78792aeaf8a5393a028050011a8e07071ee115
  evidence:
    input_path: docs/requirements-input.md
    locator: レコードのメタデータ
facts:
  proposed_api:
  - Insert
  - Get
  - List
  - Update
  - Delete
  proposed_container: collection
  payload_proposal: Superseded by the user requirement for generic JSON records.
  insert_proposal: Create only when absent; never silently upsert.
  update_proposal: Replace the value of an existing record while preserving ID.
  error_candidates:
  - not_found
  - already_exists
  - conflict
  - unsupported_capability
  - outcome_unknown
  implemented_api:
  - Insert
  - Get
  - List
  - Update
  - Delete
  implemented_value: T any with encoding/json marshal and unmarshal; conversion validated before writes.
  implemented_container: Connection-scoped Store with Bind[T] and generic methods; distinct defined types route
    to separate collections.
  driver_contract: Non-generic RawStore and optional CollectionOpener; Wrap(raw) supplies the JSON Store.
  json_rules:
  - Struct tags and custom JSON methods follow encoding/json.
  - Writes validate both encode and decode before any storage mutation; failures wrap ErrInvalid.
  - Get/List report invalid JSON or incompatible stored schemas; List returns no partial page.
  - Use compatible schemas across processes. T=any decodes JSON numbers as float64.
  - Default JSON decoding avoids caller input aliasing; ownership inside custom JSON methods is the application
    responsibility.
  format_compatibility: 'Pre-release: current bbolt binary, remote JSON, and Firebase hex keys only. No compatibility
    wrappers or migration steps.'
  metadata_api: Private id/revision fields; value-receiver ID() and Revision(); editable Data. Updating storage
    returns a new record and leaves previous metadata unchanged.
  record_json: MarshalJSON preserves id/revision/data. UnmarshalJSON replaces a complete value including metadata;
    errors leave the existing record unchanged. Encapsulation prevents accidental field assignment, not JSON-based
    replacement or stale revisions.
acceptance:
  operation-coverage:
    text: Each full-capability driver supports the five record operations.
    verified_by:
    - crud-contract
  lookup-scope:
    text: Get resolves an ID and List operates within the selected record collection.
    verified_by:
    - crud-contract
  typed-json:
    text: Open plus Bind[T] and generic methods return typed JSON records; invalid data fails before writes and
      stale revisions conflict.
    verified_by:
    - typed-json-contract
  read-only-metadata:
    text: Typed records expose metadata only through ID()/Revision(), update returns a new version, and JSON preserves
      metadata.
    verified_by:
    - metadata-contract
