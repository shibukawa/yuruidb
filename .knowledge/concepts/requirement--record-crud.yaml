open_questions:
  value-format:
    text: Use bytes, JSON, generics, or a combination?
    state: answered
    resolution: User selected JSON data and generics, Open[Data], Record[Data]{Id, Revision, Data}; the former provisional
      byte API is retained only as RawStore for drivers. Metadata subsequently moved to read-only ID()/Revision()
      methods; Data remains an exported field.
    evidence:
      input_path: docs/requirements-input.md
      locator: Goの最低バージョンと型付きJSONレコード
  collection-shape:
    text: How are collections/namespaces and their names represented?
    state: deferred
    resolution: Implemented a collection-bound Store with validated single-component names. Revisit if tenant/hierarchical
      naming is requested.
