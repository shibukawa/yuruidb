open_questions:
  static-form:
    text: How should named-import constructors and blank-import registration expose the statically imported drivers?
    state: deferred
    resolution: Initial implementation provides named-import constructors and blank-import registration; common
      config maps avoid forcing direct driver imports in tagged applications.
  preset-members:
    text: Which exact drivers/runtime helpers are included by each provider tag?
    state: deferred
    resolution: Implemented AWS=S3+DynamoDB, GCP=GCS+Firestore+Realtime Database, Cloudflare=R2+D1+KV. Revisit when
      adding a backend.
