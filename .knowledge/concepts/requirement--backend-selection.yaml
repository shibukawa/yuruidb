facts:
  accepted_examples:
    aws:
    - Lambda
    - S3
    - other AWS services
    gcp:
    - Cloud Storage
    - Firebase
    cloudflare:
    - R2
    - D1
    - KV
  runtime_vs_storage: Lambda is an execution environment; it is not a data backend.
  extension_proposal: Implement the common interfaces; statically import drivers using constructors or a registration
    API whose exact form is deferred.
  additional_feature_boundary: No particular codec, cache, encryption, or observability extension was explicitly
    requested.
  integration_model: All backends use static imports. Direct imports and provider-tag-selected imports compose the
    same driver packages.
  implemented_imports: All backends statically imported; optional backends package imports tagged groups.
  implemented_configuration: Typed driver configs and driver-neutral yuruidb.Config maps work through registered
    factories.
  implemented_profiles:
    aws:
    - s3
    - dynamodb
    gcp:
    - gcs
    - firestore
    - firebase
    cloudflare:
    - r2
    - d1
    - cfkv
acceptance:
  direct-selection:
    text: A backend can be statically imported individually without any provider tag.
    verified_by:
    - build-matrix
  tag-selection:
    text: Each provider build tag enables the static import group for that provider, using the same backend packages
      as individual imports.
    verified_by:
    - build-matrix
