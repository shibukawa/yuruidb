id: design:build-composition
type: design
title: Provider-tagged groups of static backend imports
summary: Provider-tagged Go files statically import the same driver packages available to explicit individual imports;
  package and registration details remain proposed.
lifecycle: active
authority: inferred
aliases:
- presets
- registry
- go:build
- go mod tidy
facts:
  package_roles:
    core: Standard-library-only Store, registry, UUIDv7 and config decoding.
    drivers: Direct typed constructors plus static init registration.
    composition: backends package with tagged static-import Go files.
    runtime_helpers: AWS environment/web identity/container/IMDSv2 and GCP metadata credentials; no Lambda runtime
      bundled.
  registration_rule: If registration is used, register factories only; no network/auth/database opening during init.
  driver_choice: Tags enable imports; Open selects a linked driver with a typed config or core Config map.
  unregistered: If registry opening is used, a driver absent from the statically linked registry yields an explicit
    error.
  tag_proposals:
    s3: s3 || aws
    dynamodb: dynamodb || aws
    lambda: No driver enabled by lambda alone; lambda,s3 selects s3.
    gcs: gcs || gcp
    firebase: firebase || gcp imports RTDB and Firestore; firestore alone imports Firestore only.
    r2: r2 || cloudflare
    d1: d1 || cloudflare
    cfkv: cfkv || cloudflare
  examples:
  - aws
  - gcp
  - cloudflare
  - lambda,s3
  - gcs,r2
  - aws,gcp,cloudflare
  composition_semantics: Union of static import groups; avoid duplicate registration if the proposed registry is
    adopted.
  tag_boundary: An unconditional application import is unaffected by assembly tags.
  module_proposal: Separate core, dependency-bearing driver modules, and optional composition module as needed.
  module_tradeoff: More modules isolate dependency manifests but increase releases and maintenance.
  tidy_boundary: go mod tidy sees nearly all tags; tags alone do not isolate the module dependency graph.
  direct_import_tradeoff: Individual static imports minimize the linked set; provider tags activate a convenient
    group of the same static imports.
  accepted_integration_model: All backends are statically imported; provider build tags enable groups of those static
    imports.
  accepted_vs_proposed: Static linkage and provider-tagged import groups are accepted. Optional package layout,
    registry design, service tags, and exact preset membership remain proposals.
  implementation_state: Implemented; public packaging and registration details remain revisable engineering choices.
  module_implementation: Single module initially; no cloud SDK dependencies. Separate modules remain a possible
    future packaging change.
