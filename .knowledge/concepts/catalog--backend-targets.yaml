open_questions:
  firebase-product:
    text: Does Firebase mean Firestore, Realtime Database, or both?
    state: deferred
    resolution: Implemented both products in separate drivers. No product-selection question blocks using the library.
  rdb-engines:
    text: Which SQL engines should have first-party drivers?
    state: deferred
    resolution: Implemented SQLite and PostgreSQL dialects over injected database/sql; actual SQLite tested, real
      PostgreSQL unverified. Additional engines remain deferred.
  d1-path:
    text: Use D1 administrative REST directly, a Worker gateway, or both?
    state: deferred
    resolution: Direct administrative REST implemented with limits documented; Worker gateway deployment remains
      outside the library.
