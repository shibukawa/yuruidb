id: catalog:backend-targets
type: catalog
title: Requested backend targets and candidate access paths
summary: Target inventory; all library adapters are unimplemented and provider facts are documentation-only observations.
lifecycle: accepted
authority: authored
aliases:
- bbolt
- DynamoDB
- RDB
- S3
- GCS
- Firebase
- R2
- D1
- KV
facts:
  implementation_status: Eleven built-in drivers implemented; cloud HTTP protocols tested with local fixtures, not
    live services.
  targets:
    bbolt:
      category: local_kv
      candidate: Native bbolt transactions and key cursors
      shared_remote_processes: false
    dynamodb:
      category: remote_kv
      candidate: HTTP conditional writes; collection partition and sortable ID key
    other-kvs:
      category: extension
      candidate: Public Store/Factory registration plus adapter.Backend allow statically imported third-party KVS
        drivers.
    rdb:
      category: sql
      candidate: database/sql plus per-engine driver and parameterized revision predicates
    s3:
      category: object
      candidate: HTTP conditionals and immutable ID object keys
      scope: General purpose buckets first
    gcs:
      category: object
      candidate: HTTP generation preconditions
    firebase:
      category: document_or_tree
      candidate: Implemented separate firestore and firebase (Realtime Database) REST drivers; gcp imports both.
    r2:
      category: object
      candidate: S3-compatible HTTP conditionals; separate compatibility checks
    d1:
      category: sql
      candidate: REST SQL for limited traffic or a deployed Worker HTTP gateway
    cfkv:
      category: eventual_kv
      candidate: Implemented reads/list and explicit unconditional Set/Remove; strict mutations return ErrUnsupported.
  capability_reporting_proposal:
  - conditional_create
  - compare_and_swap
  - conditional_delete
  - ordered_list
  - read_consistency
  - distributed_access
  - snapshot_pagination
  provider_vs_adapter: Implemented adapters are locally verified; provider documentation and fixture tests do not
    establish live compatibility.
  limits: Record size, throughput, page limits, cost, and authentication remain backend-specific.
