id: decision:typed-collection-routing
type: decision
title: Use defined Go types to route generic methods to collections
lifecycle: accepted
authority: authored
summary: A Go 1.27 Store owns one backend connection; Done and Waiting are distinct defined types bound to stable
  collection names.
facts:
  api:
  - Open
  - Store.Bind[T]
  - Store.Get[T]
  - Store.List[T]
  - Store.Delete[T]
  type_identity: type Done Job and type Waiting Job are distinct; type Done = Job is an alias. Pointer/value forms
    share one binding.
  ownership: Store.Close owns the connection; internal collection views borrow it. bbolt shares connections per
    normalized path across owners.
  physical_names: Explicit Bind names survive Go type or package renames.
  public_collection_view: Not provided; one logical type selects one collection.
  limitations:
  - JSON compatibility across processes is the application responsibility
  - Defined types do not inherit methods
  - No transaction spans jobs-to-done movement
  prerelease: User explicitly excluded migration steps because no version has been published.
relations:
- relation: realizes
  to: requirement:record-crud
- relation: implemented_by
  to: implementation:initial-library
