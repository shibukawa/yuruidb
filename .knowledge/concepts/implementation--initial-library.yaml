id: implementation:initial-library
type: implementation
title: Initial statically composed Go storage library
lifecycle: active
authority: observed
summary: Go 1.27 multi-collection JSON API, conditional physical deletion, reconciliation, efficient local storage,
  role credentials, streaming blobs and isolated SQLite tests.
facts:
  public_entry_points:
  - yuruidb.Store
  - yuruidb.Record[T]
  - yuruidb.Page[T]
  - yuruidb.Open
  - Store.Bind[T]
  - Store.Get[T]
  - Store.List[T]
  - Store.Delete[T]
  - Store.PurgeTombstones[T]
  - yuruidb.RawStore
  - yuruidb.OpenRaw
  - yuruidb.Wrap
  - yuruidb.MutationError
  - adapter.New
  - adapter.NewRaw
  - s3.OpenBlobs
  - r2.OpenBlobs
  - gcs.OpenBlobs
  drivers:
  - memory
  - bbolt
  - sql
  - s3
  - dynamodb
  - gcs
  - firestore
  - firebase
  - r2
  - d1
  - cfkv
  module_path: github.com/shibukawa/yuruidb
  report: docs/implementation-validation.md
  guide: docs/implementation.ja.md
  unverified:
  - Live cloud integrations
  - Real PostgreSQL
  - Service IAM/rate limits
  - Performance/size/cold-start benchmarks
  current_limits:
  - Ascending byte order only; UUIDv7 is a generator, not an ID restriction
  - No page snapshots or multi-key transactions
  - Conditional-deletion fallback retains tombstones where conditions are unsupported
  - Profiles/SSO/ADC beyond supplied providers require injection
  - Blob IDs are immutable and should not be reused; blob native tokens do not have record nonce semantics
  minimum_go_version: 1.27.0
  data_encoding: encoding/json in Store; compact binary envelopes in bbolt and JSON envelopes on remote transports.
  kv_api: Store.Set[T]/Remove[T] expose explicit unconditional KV operations; CAS CRUD remains unsupported on KV.
  verified_go_versions:
  - 1.27.0
  record_metadata: ID()/Revision() read private fields; Data remains editable. Record JSON supports id/revision/data
    in both directions.
  implemented_optimizations:
  - Conditional create before read
  - Native CAS token in scoped revision
  - Value-bearing Scan for bbolt/memory/SQL/D1/DynamoDB/Firestore
  - Conditional tombstone cleanup
  - Path-shared bbolt DB and binary values
  - AWS environment/web identity/container/IMDSv2 credentials with refresh
  - Verified custom S3/R2 conditions and AWS virtual hosting
  - Immutable streaming Blob API
  - cgo SQLite dependency isolated to integration module
  prerelease_formats: No legacy compatibility or migration procedures; use the current API and storage formats.
