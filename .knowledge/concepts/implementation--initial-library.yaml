id: implementation:initial-library
type: implementation
title: Initial statically composed Go storage library
lifecycle: active
authority: observed
summary: Generic JSON record API on Go 1.26+, eleven statically imported drivers, HTTP auth, import profiles, and
  locally verified concurrency semantics.
facts:
  public_entry_points:
  - yuruidb.Store[T]
  - yuruidb.Record[T]
  - yuruidb.Page[T]
  - yuruidb.Open[T]
  - yuruidb.RawStore
  - yuruidb.OpenRaw
  - yuruidb.Wrap[T]
  - yuruidb.Register
  - yuruidb.Config
  - yuruidb.NewID
  - github.com/shibukawa/yuruidb/adapter.New[T]
  - github.com/shibukawa/yuruidb/adapter.NewRaw
  drivers:
  - memory
  - bbolt
  - sql
  - s3
  - dynamodb
  - gcs
  - firestore
  - firebase
  - r2
  - d1
  - cfkv
  module_path: github.com/shibukawa/yuruidb
  report: docs/implementation-validation.md
  guide: docs/implementation.ja.md
  unverified:
  - Live cloud integrations
  - Real PostgreSQL
  - Service IAM/rate limits
  - Performance/size/cold-start benchmarks
  current_limits:
  - Ascending ID order only
  - No page snapshots
  - Retained tombstones; no physical GC
  - No durable format migrations
  - CF KV has no conditional mutation contract
  - Caller-injected auth for SSO/ADC/federation beyond supplied environment/metadata providers
  minimum_go_version: 1.26.0
  data_encoding: encoding/json in Store[T]; drivers register non-generic raw byte factories and expose Open[T] plus
    OpenRaw.
  kv_api: Typed Store[T].Set/Remove expose explicit unconditional KV operations. Other drivers return ErrUnsupported;
    Insert/Update/Delete do not degrade into unconditional writes.
  verified_go_versions:
  - 1.26.0
  - 1.27.0
  record_metadata: ID()/Revision() read private fields; Data remains editable. Record JSON supports id/revision/data
    in both directions.
relations:
- relation: implements
  to: requirement:record-crud
- relation: implements
  to: requirement:creation-order
- relation: implements
  to: requirement:concurrent-access
- relation: implements
  to: requirement:lightweight-drivers
- relation: implements
  to: requirement:backend-selection
