id: implementation:initial-library
type: implementation
title: Initial statically composed Go storage library
lifecycle: active
authority: observed
summary: Common UUIDv7 record API, eleven built-in drivers, HTTP auth, static-import profiles, and locally verified
  concurrency semantics.
facts:
  public_entry_points:
  - yuruidb.Store
  - yuruidb.Open
  - yuruidb.Register
  - yuruidb.Config
  - yuruidb.NewID
  - github.com/shibukawa/yuruidb/adapter
  drivers:
  - memory
  - bbolt
  - sql
  - s3
  - dynamodb
  - gcs
  - firestore
  - firebase
  - r2
  - d1
  - cfkv
  module_path: github.com/shibukawa/yuruidb
  report: docs/implementation-validation.md
  guide: docs/implementation.ja.md
  unverified:
  - Live cloud integrations
  - Real PostgreSQL
  - Service IAM/rate limits
  - Performance/size/cold-start benchmarks
  current_limits:
  - Ascending ID order only
  - No page snapshots
  - Retained tombstones; no physical GC
  - No durable format migrations
  - CF KV has no conditional mutation contract
  - Caller-injected auth for SSO/ADC/federation beyond supplied environment/metadata providers
relations:
- relation: implements
  to: requirement:record-crud
- relation: implements
  to: requirement:creation-order
- relation: implements
  to: requirement:concurrent-access
- relation: implements
  to: requirement:lightweight-drivers
- relation: implements
  to: requirement:backend-selection
