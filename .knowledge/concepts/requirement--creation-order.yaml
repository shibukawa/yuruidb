open_questions:
  uuid-format:
    text: Require RFC UUIDv7 exactly, and who generates or supplies IDs?
    state: deferred
    resolution: Initial implementation generates and requires canonical lowercase RFC UUIDv7 IDs. Callers allocate
      IDs before insert; revisit on concrete external-ID requirements.
  direction:
    text: Must all backends support newest-first, oldest-first, or both?
    state: deferred
    resolution: Ascending implemented. Descending is deferred until requested or backed by an explicit storage/listing
      design.
  snapshot:
    text: What consistency is required within and across pages?
    state: deferred
    resolution: Live keyset traversal implemented without page snapshots; revisit if an application needs a stable
      snapshot.
