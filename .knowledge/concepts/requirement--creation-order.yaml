id: requirement:creation-order
type: requirement
title: Immutable IDs with ascending byte-order listing
summary: List by immutable ID bytes; validated names are accepted and NewID generates monotonic UUIDv7 values.
lifecycle: accepted
authority: authored
aliases:
- UUIDv7
- 作成順
- 更新順の修正
