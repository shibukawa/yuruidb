facts:
  comparator_proposal: Canonical byte order of immutable record IDs.
  distributed_boundary: ID timestamp order is not exact cross-process generation or commit order.
  same_millisecond: Separate processes may generate IDs with equal timestamps and different random suffixes.
  clock_skew: Generator clocks may differ; strict chronological order is not promised.
  object_storage_inference: An immutable ID can be the object key, avoiding a mutable update-time index.
  proposed_first_direction: ascending
  proposed_pagination: Opaque cursor bound to driver, collection, direction, and last traversed key.
  pagination_boundary: Concurrent inserts/deletes are not a cross-page snapshot; late IDs before the cursor may
    be missed.
  implemented_direction: ascending
  implemented_id: RFC 9562 UUIDv7; process-local monotonic generation, including clock rollback.
  implemented_pagination: Opaque base64 keyset cursors; no cross-page snapshot.
