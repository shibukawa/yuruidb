open_questions:
  revision-contract:
    text: Make expected revisions mandatory for all update/delete calls?
    state: deferred
    resolution: Implemented mandatory expected revisions. Revisit only on explicit API feedback.
  delete-aba:
    text: Choose conditional deletion, tombstones, and ID-reuse rules per backend.
    state: answered
    resolution: Random record nonce and incarnation-specific native CAS token prevent stale writes/deletes after
      physical deletion and recreation. Unsupported deletion conditions fall back to tombstones.
  idempotency:
    text: How are retries and unknown write outcomes exposed?
    state: answered
    resolution: Conditional HTTP replay plus nonce readback; unresolved outcomes preserve MutationError. Superseding
      writes or physical absence do not prove which historic mutation committed. Exactly-once history is not promised.
