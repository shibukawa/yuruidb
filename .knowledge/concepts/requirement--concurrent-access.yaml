id: requirement:concurrent-access
type: requirement
title: Independent-process remote access
summary: Support shared remote storage from multiple Lambda-like processes and use optimistic concurrency for object
  storage.
lifecycle: accepted
authority: authored
aliases:
- Lambda
- 楽観ロック
- CAS
- 競合制御
assertions:
- key: multi-process
  predicate: required_execution_model
  value: Multiple independent processes share a remote backend
  authority: authored
  basis:
  - path: docs/requirements-input.md
    input_hash: 401edd4f59abce29df56c883931c4409a65443dabfd87aa8424ae9aa8cc2cd23
  evidence:
    input_path: docs/requirements-input.md
- key: optimistic
  predicate: intended_object_concurrency
  value: Optimistic locking or equivalent conditional operations
  authority: authored
  basis:
  - path: docs/requirements-input.md
    input_hash: 401edd4f59abce29df56c883931c4409a65443dabfd87aa8424ae9aa8cc2cd23
  evidence:
    input_path: docs/requirements-input.md
facts:
  proposed_mutation_contract: Insert-if-absent; Update/Delete carry an opaque expected revision.
  revision_semantics: Revision changes on mutation and must not permit stale writes after content cycles or ID recreation.
  revision_vs_id: Revision is an opaque concurrency token, distinct from the immutable creation-order ID.
  safety_primitive: Atomic conditional operation or transaction on the authoritative backend.
  forbidden_fallback_proposal: Do not emulate distributed CAS with process-local mutex or unconditional read-then-write.
  retry_boundary: Do not resolve semantic conflicts by silently replacing the expected revision.
  unknown_outcome: A timeout after dispatch may mean a mutation committed; retry behavior requires an explicit contract.
  bbolt_boundary: bbolt serves local persistence, not shared remote multi-process access.
  implemented_mutations: Expected revisions are mandatory for update/delete; atomic backend conditions guard final
    writes; new revisions prevent ABA.
  implemented_deletion: All strict adapters retain revision-bearing tombstones and allow conditional recreation;
    physical GC is not implemented.
  implemented_retry: No automatic retries; ambiguous HTTP mutations and database/sql execution failures return ErrOutcomeUnknown
    conservatively.
acceptance:
  concurrent-mutation:
    text: On a driver advertising safe conditional mutations, concurrent writes using one expected revision cannot
      both succeed.
    verified_by:
    - remote-race
  missing-capability:
    text: A configuration requesting conflict-safe mutations fails clearly if the driver cannot provide them.
    verified_by:
    - remote-race
