open_questions:
  revision-contract:
    text: Make expected revisions mandatory for all update/delete calls?
    state: deferred
    resolution: Implemented mandatory expected revisions. Revisit only on explicit API feedback.
  delete-aba:
    text: Choose conditional deletion, tombstones, and ID-reuse rules per backend.
    state: deferred
    resolution: Implemented tombstones plus fresh random revisions on every mutation and recreation. Revisit GC
      before introducing physical reclamation.
  idempotency:
    text: How are retries and unknown write outcomes exposed?
    state: deferred
    resolution: Implemented caller-assigned IDs, no automatic retries, and explicit unknown-outcome errors. Exactly-once
      execution is not claimed.
